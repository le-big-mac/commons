<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect id="surface" x="0" y="0" width="900" height="520" fill="#fcfcfb"/>
<text x="40.0" y="32.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">A line 1.7 in 100 steeper than the theory&#8217;s, less 0.04, fits from 100 points to 300,000</text>
<text x="40.0" y="54.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Discs of exactly n points: the variance of the count over what the theory gives, against n to the power &#8722;1/3.</text>
<text x="40.0" y="71.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Bars: one standard error either way (0.002 to 0.004; most are hidden by their dots). The solid line is c&#183;n^(1/3) + b fitted to all eight variances.</text>
<circle class="key" cx="46" cy="98" r="5" fill="#2a78d6"/>
<text x="58.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the third sheet&#8217;s discs</text>
<circle class="key" cx="226" cy="98" r="5" fill="#eb6834"/>
<text x="238.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the fourth sheet&#8217;s discs</text>
<line x1="412" y1="98" x2="442" y2="98" stroke="#0b0b0b" stroke-width="2"/>
<text x="450.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the line fitted</text>
<line x1="556" y1="98" x2="586" y2="98" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="594.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the theory; the third sheet&#8217;s line carried down</text>
