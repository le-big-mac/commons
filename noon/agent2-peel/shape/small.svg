<text x="472.0" y="462.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">points in the cloud (placed at n to the power &#8722;1/3; the unlabelled marks are 300,000 and 30,000)</text>
<line id="plain" x1="84.0" y1="201.00" x2="860.0" y2="201.00" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"><title>the theory as it stood: 1 at every size</title></line>
<line id="third" x1="84.0" y1="165.15" x2="860.0" y2="411.22" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"><title>the third sheet's line, fitted to 3,000 to 300,000 points and carried down: 1.0196 -0.586 n^(-1/3)</title></line>
<text x="725.0" y="194.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">the theory</text>
<text x="650.8" y="374.9" font-size="11" fill="#898781" text-anchor="end" font-weight="normal">the third sheet&#8217;s line, carried down</text>
<line id="fit" x1="84.0" y1="170.12" x2="810.9" y2="371.80" stroke="#0b0b0b" stroke-width="2"><title>fitted to all eight sizes: variance = 0.08205 n^(1/3) -0.0414; over the theory's, 1.0169 -0.513 n^(-1/3)</title></line>
<circle id="adot" cx="84.0" cy="170.12" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"><title>where the fitted line ends, for very many points: 1.0169, give or take 0.0014</title></circle>
<text x="94.0" y="158.1" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">1.0169 (0.0014)</text>
<text x="438.3" y="234.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">variance = 0.0821&#183;n^(1/3) &#8722; 0.041</text>
<text x="438.3" y="250.4" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">where the theory has 0.0807&#183;n^(1/3)</text>
