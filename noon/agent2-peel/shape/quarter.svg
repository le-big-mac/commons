<text x="40.0" y="32.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">The quarter disc is on its line to 0.4 parts in 100: the four sealed sets give 0.999 (0.002)</text>
<text x="40.0" y="54.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Every set of quarter discs, in the order it was made: the spread of the count (variance &#215; n / mean&#178;) over what the theory gives,</text>
<text x="40.0" y="71.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">so that 1 is the quarter disc&#8217;s own line. Bars: one standard error either way.</text>
