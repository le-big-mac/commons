<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect id="surface" x="0" y="0" width="900" height="500" fill="#fcfcfb"/>
<text x="40.0" y="32.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">The smaller the cloud, the lower: below the theory under 30,000 points, above it over</text>
<text x="40.0" y="54.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Discs of exactly n points: the spread of the count (variance &#215; n / mean&#178;) over what the theory gives, against n to the power &#8722;1/3.</text>
<text x="40.0" y="71.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Bars: one standard error either way. The solid line is fitted to the four sizes from 10,000 to 300,000.</text>
<circle class="key" cx="46" cy="98" r="5" fill="#2a78d6"/>
<text x="58.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the third sheet&#8217;s discs</text>
<line x1="216" y1="98" x2="246" y2="98" stroke="#0b0b0b" stroke-width="2"/>
<text x="254.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the line fitted</text>
<line x1="356" y1="98" x2="386" y2="98" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="394.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the two readings written beforehand</text>
<line class="grid" x1="84" y1="400.0" x2="860" y2="400.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="0.97" x="76" y="404.0" font-size="11" fill="#898781" text-anchor="end">0.97</text>
<line class="grid" x1="84" y1="354.0" x2="860" y2="354.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="0.98" x="76" y="358.0" font-size="11" fill="#898781" text-anchor="end">0.98</text>
<line class="grid" x1="84" y1="308.0" x2="860" y2="308.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="0.99" x="76" y="312.0" font-size="11" fill="#898781" text-anchor="end">0.99</text>
<line class="grid" x1="84" y1="262.0" x2="860" y2="262.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="1.00" x="76" y="266.0" font-size="11" fill="#898781" text-anchor="end">1.00</text>
<line class="grid" x1="84" y1="216.0" x2="860" y2="216.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="1.01" x="76" y="220.0" font-size="11" fill="#898781" text-anchor="end">1.01</text>
<line class="grid" x1="84" y1="170.0" x2="860" y2="170.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="1.02" x="76" y="174.0" font-size="11" fill="#898781" text-anchor="end">1.02</text>
<line class="grid" x1="84" y1="124.0" x2="860" y2="124.0" stroke="#e1e0d9" stroke-width="1"/>
<text class="ytick" data-v="1.03" x="76" y="128.0" font-size="11" fill="#898781" text-anchor="end">1.03</text>
<line x1="84.0" y1="400" x2="84.0" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="0" x="84.0" y="420" font-size="11" fill="#898781" text-anchor="middle">very many</text>
<line x1="238.6" y1="400" x2="238.6" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="300000" x="238.6" y="420" font-size="11" fill="#898781" text-anchor="middle">300,000</text>
<line x1="306.9" y1="400" x2="306.9" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="100000" x="306.9" y="420" font-size="11" fill="#898781" text-anchor="middle">100,000</text>
<line x1="417.0" y1="400" x2="417.0" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="30000" x="417.0" y="420" font-size="11" fill="#898781" text-anchor="middle">30,000</text>
<line x1="564.2" y1="400" x2="564.2" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="10000" x="564.2" y="420" font-size="11" fill="#898781" text-anchor="middle">10,000</text>
<line x1="801.4" y1="400" x2="801.4" y2="405" stroke="#898781" stroke-width="1"/>
<text class="xtick" data-n="3000" x="801.4" y="420" font-size="11" fill="#898781" text-anchor="middle">3,000</text>
<text x="472.0" y="442.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">points in the cloud (placed at n to the power &#8722;1/3)</text>
<line id="plain" x1="84.0" y1="262.00" x2="860.0" y2="262.00" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"><title>the plain reading: r = 1 at every size</title></line>
<line id="lean" x1="84.0" y1="179.20" x2="860.0" y2="400.00" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4"><title>the lean read from the earlier clouds: r = 1.018 - 0.64 n^(-1/3)</title></line>
<text x="766.9" y="255.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">plain</text>
<text x="570.3" y="341.6" font-size="11" fill="#898781" text-anchor="end" font-weight="normal">the lean read from the earlier clouds</text>
<line id="fit" x1="84.0" y1="166.42" x2="564.2" y2="303.31" stroke="#0b0b0b" stroke-width="2"><title>the line fitted to the four sizes from 10,000 to 300,000: r = 1.0208 -0.641 n^(-1/3)</title></line>
<line id="abar" x1="84.0" y1="183.95" x2="84.0" y2="148.90" stroke="#0b0b0b" stroke-width="2"/>
<circle id="adot" cx="84.0" cy="166.42" r="5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"><title>where the fitted line ends, for very many points: 1.0208, give or take 0.0038</title></circle>
<text x="94.0" y="142.9" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">1.021 (0.004)</text>
<line class="bar" data-n="3000" x1="801.4" y1="378.88" x2="801.4" y2="359.23" stroke="#2a78d6" stroke-width="2"/>
<circle class="dot" data-n="3000" cx="801.4" cy="369.05" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>400,000 discs of 3,000 points: 0.9767, give or take 0.0021</title></circle>
<line class="bar" data-n="10000" x1="564.2" y1="317.01" x2="564.2" y2="296.67" stroke="#2a78d6" stroke-width="2"/>
<circle class="dot" data-n="10000" cx="564.2" cy="306.84" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>400,000 discs of 10,000 points: 0.9903, give or take 0.0022</title></circle>
<line class="bar" data-n="30000" x1="417.0" y1="263.05" x2="417.0" y2="242.80" stroke="#2a78d6" stroke-width="2"/>
<circle class="dot" data-n="30000" cx="417.0" cy="252.93" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>400,000 discs of 30,000 points: 1.0020, give or take 0.0022</title></circle>
<line class="bar" data-n="100000" x1="306.9" y1="249.17" x2="306.9" y2="225.40" stroke="#2a78d6" stroke-width="2"/>
<circle class="dot" data-n="100000" cx="306.9" cy="237.29" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>300,000 discs of 100,000 points: 1.0054, give or take 0.0026</title></circle>
<line class="bar" data-n="300000" x1="238.6" y1="226.29" x2="238.6" y2="192.45" stroke="#2a78d6" stroke-width="2"/>
<circle class="dot" data-n="300000" cx="238.6" cy="209.37" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>150,000 discs of 300,000 points: 1.0114, give or take 0.0037</title></circle>
<line x1="84" y1="400" x2="860" y2="400" stroke="#898781" stroke-width="1"/>
</svg>
